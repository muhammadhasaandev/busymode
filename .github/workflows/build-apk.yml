name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Reuse the same signing key on every build so new versions install over old ones.
      - name: Keep signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: busymode-signing-key-v1

      - name: Prepare Node.js runtime and engine
        run: ./scripts/prepare.sh

      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BusyMode.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BusyMode-APK
          path: BusyMode.apk
          if-no-files-found: error

      - name: Publish as a release (easy phone download)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Busy Mode build ${{ github.run_number }}
          files: BusyMode.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
